name: Godot validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot 4.7.2 import and tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Godot
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $archive
          $expected = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'godot-4.7.2')

      - name: Import and run existing suites
        shell: pwsh
        run: |
          $engine = Join-Path $env:RUNNER_TEMP 'godot-4.7.2/Godot_v4.7.2-stable_win64_console.exe'
          ./tools/validate.ps1 -Godot $engine
