<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolHunter / Visual review</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ee;color:#213c32;font:15px system-ui}button,input,select,textarea{font:inherit}button,a,select{touch-action:manipulation}button,select,input{padding:10px 13px;border:1px solid #c6d0c7;border-radius:9px;background:white;color:#213c32}button{cursor:pointer}button:hover{background:#e9eee4}button:disabled{opacity:.4;cursor:default}a{color:#235c43}header{background:#183b30;color:#fff;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px}header h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:#b9d2c2;font-size:13px}.tabs{display:flex;gap:6px}.tabs a{padding:10px 22px;color:#d8e5dc;text-decoration:none;border-radius:8px}.tabs a.active{background:#e8efdc;color:#1c3e30}.toolbar{padding:13px 25px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #d6ddd2;background:#fcfcf8}.toolbar div{display:flex;gap:8px;align-items:center}.primary{background:#2a6047;color:white;border-color:#2a6047}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);height:calc(100vh - 153px)}aside{background:#eaece4;padding:18px 14px;overflow:auto;border-right:1px solid #d5ddcf}aside input,aside select{width:100%;margin:0 0 10px}aside label{display:block;font-size:12px;font-weight:650;margin:0 0 5px}.list{display:grid;gap:6px}.item{display:block;text-align:left;width:100%;padding:12px;background:#f8f9f4;border-color:transparent}.item.active{border-color:#3b7251;background:#dce9d0}.item span{display:block;font-weight:650}.item small{display:block;color:#627267;margin-top:3px}.count{font-size:12px;color:#5f7163;margin:8px 0 12px}main{overflow:auto;padding:24px 30px;max-width:1500px;width:100%;margin:auto}.heading{display:flex;justify-content:space-between;gap:15px;align-items:start}h2{font-size:27px;margin:0 0 5px}.meta{color:#657568;font-size:13px;line-height:1.6}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#e1eacb;font-size:12px;white-space:nowrap}.viewer{background:white;border:1px solid #e0e4da;border-radius:14px;overflow:hidden;margin:17px 0}.viewbar{display:flex;justify-content:space-between;padding:10px 15px;border-bottom:1px solid #edf0e8;align-items:center;gap:10px}.viewer img{display:block;width:100%;height:min(48vh,540px);object-fit:contain;cursor:zoom-in}.viewbar small{color:#68766d}.panel{background:#fff;border:1px solid #dce2d6;border-radius:12px;padding:18px;margin:15px 0}.panel h3{font-size:16px;margin:0 0 12px}.review-grid{display:grid;grid-template-columns:230px 1fr;gap:20px}.review-grid label{display:block;font-weight:600;margin-bottom:7px}textarea{width:100%;min-height:100px;border:1px solid #c7d1c6;border-radius:9px;padding:12px;resize:vertical}.review-grid select{width:100%}.help{font-size:12px;color:#6c796e;line-height:1.6}details summary{cursor:pointer;color:#43684b}dialog{border:0;border-radius:15px;max-width:900px;width:90vw;padding:25px;color:#213c32}dialog::backdrop{background:#14251dcc}dialog h2{font-size:23px}dialog textarea{min-height:270px}#zoom{width:96vw;max-width:2200px}#zoom img{width:100%;max-height:82vh;object-fit:contain}.dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:15px}pre{white-space:pre-wrap;max-height:50vh;overflow:auto;background:#f1f3eb;padding:16px;border-radius:8px}#toast{position:fixed;bottom:20px;right:25px;background:#203e31;color:white;border-radius:9px;padding:12px 20px;z-index:9;max-width:90vw}.empty{padding:50px;color:#617462;text-align:center}@media(max-width:760px){header{padding:15px;flex-wrap:wrap}.toolbar{padding:10px;flex-wrap:wrap}.layout{display:block;height:auto}aside{max-height:320px}.list{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:20px 14px}.review-grid{grid-template-columns:1fr}.heading{flex-wrap:wrap}.viewer img{height:350px}}
</style></head><body>
<header><div><h1>SolHunter <span style="font-weight:350">/ Visual review</span></h1><p id="subtitle"></p></div><div class="tabs"><a id="plants-tab">Plants</a><a id="sols-tab">Sols</a></div></header>
<div class="toolbar"><div><button id="preferences-button">Preferences & direction</button><span class="help" id="progress"></span></div><div><button id="download">Save review</button><button class="primary" id="copy">Copy review to chat</button></div></div>
<div class="layout"><aside><label for="query">Find an item</label><input id="query" placeholder="Name, review ID, or class"><label for="scope">Show</label><select id="scope"><option value="all">All items</option><option value="pending">Not reviewed here</option><option value="approved">Approved baselines</option><option value="redo">Requested changes</option><option value="decided">My decisions</option></select><label for="category" id="category-label">Category</label><select id="category"></select><div class="count" id="count"></div><div id="list" class="list"></div></aside><main id="main"></main></div>
<dialog id="preferences-dialog"><h2 id="preferences-title">Preferences & direction</h2><p class="help">General direction carries across review rounds. Put changes for one model in its review notes.</p><textarea id="preferences" aria-label="Review preferences"></textarea><p class="help">Saved in this browser as you type. Included when you copy or save a review.</p><div class="dialog-actions"><button data-close>Done</button></div></dialog>
<dialog id="export-dialog"><h2>Review ready to share</h2><p id="copy-status">Paste this review into the chat.</p><pre id="export-text"></pre><div class="dialog-actions"><button data-close>Close</button></div></dialog><dialog id="zoom"><button data-close>Close full-size image</button><img alt="Full-size review image"></dialog><div id="toast" hidden role="status"></div>
<script type="application/json" id="data">__DATA__</script><script>
const payload=JSON.parse(document.getElementById('data').textContent),domain=payload.domain,sol=domain==='sols',data=payload[domain],rows=data.plants,$=s=>document.querySelector(s),prefix=sol?'solhunter-sol-':'solhunter-plant-',storage=prefix+'decisions-'+data.revision;
let saved={},preferences=data.preferences.join('\n'),current=rows[0]?.code,visible=rows,version=0,angle='pair';try{saved=JSON.parse(localStorage.getItem(storage)||'{}');preferences=localStorage.getItem(prefix+'preferences')||preferences}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#plants-tab').href=sol?'../index.html':'index.html';$('#sols-tab').href=sol?'index.html':'sols/index.html';$(sol?'#sols-tab':'#plants-tab').classList.add('active');$('#subtitle').textContent=(sol?'Sol appearances':'Plant appearances')+' · '+data.revision+' · '+rows.length+' designs';$('#preferences-title').textContent=(sol?'Sol':'Plant')+' preferences & direction';$('#category-label').textContent=sol?'Class':'Biome';$('#preferences').value=preferences;
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2800)}function persist(){try{localStorage.setItem(storage,JSON.stringify(saved))}catch(e){toast('Storage unavailable. Copy or save your review before closing.')}}
function decision(r){return saved[r.code]||{decision:r.approved?'accept':'pending',note:''}}function asset(p){return p}function status(r){return r.approved?'Approved · '+(r.approval_revision||'round-02'):decision(r).decision==='redo'?'Changes requested':'Not reviewed here'}
$('#category').innerHTML='<option value="all">All '+(sol?'classes':'biomes')+'</option>'+[...new Set(rows.map(r=>r.biome))].map(v=>`<option value="${esc(v)}">${esc(v.replaceAll('_',' '))}</option>`).join('');
function filter(){let q=$('#query').value.toLowerCase(),scope=$('#scope').value,category=$('#category').value;visible=rows.filter(r=>(category==='all'||r.biome===category)&&[r.code,r.name,r.biome,r.plant_id].join(' ').toLowerCase().includes(q)&&(scope==='all'||scope==='approved'&&r.approved||scope==='pending'&&!r.approved&&decision(r).decision==='pending'||scope==='redo'&&decision(r).decision==='redo'||scope==='decided'&&decision(r).decision!=='pending'));if(!visible.some(r=>r.code===current)){current=visible[0]?.code;version=0;angle='pair'}render()}
function render(){let r=rows.find(r=>r.code===current);$('#count').textContent=visible.length+' of '+rows.length+' designs';$('#progress').textContent=rows.filter(r=>decision(r).decision!=='pending').length+' reviewed / '+rows.length;$('#list').innerHTML=visible.map(r=>`<button class="item ${r.code===current?'active':''}" data-item="${r.code}"><span>${r.code} · ${esc(r.name)}</span><small>${esc(r.biome.replaceAll('_',' '))} · ${status(r)}</small></button>`).join('');if(!r||!visible.length){$('#main').innerHTML='<div class="empty">No designs match these filters. Try another name or choose All items.</div>';return}let d=decision(r),i=visible.indexOf(r);$('#main').innerHTML=`<div class="heading"><div><div class="meta">${r.code} / ${esc(r.group)}</div><h2>${esc(r.name)}</h2><div class="meta">${esc(r.biome.replaceAll('_',' '))}</div></div><span class="badge">${status(r)}</span></div><div class="viewer"><div class="viewbar"><select id="version" aria-label="Compare versions"></select><select id="angle" aria-label="Viewing angle"><option value="pair">Both angles</option><option value="0">${sol?'Front three-quarter':'Low three-quarter'}</option><option value="1">${sol?'Rear three-quarter':'Higher angle'}</option></select><small>Click image to enlarge</small></div><img id="picture" alt="${esc(r.name)} close-up"></div><div class="viewbar" style="border:0;padding:0"><button id="previous" ${i===0?'disabled':''}>← Previous</button><span class="help">${i+1} of ${visible.length} in this set</span><button id="next" ${i===visible.length-1?'disabled':''}>Next →</button></div><section class="panel"><h3>Your review</h3><div class="review-grid"><div><label for="decision">Decision</label><select id="decision"><option value="pending">Not reviewed yet</option><option value="accept">Accept this design</option><option value="redo">Request changes</option><option value="keep-original">Keep original</option></select><p class="help">Notes apply even when accepting. Choices stay local until shared.</p></div><div><label for="notes">Notes for ${r.code}</label><textarea id="notes" placeholder="What should stay? What should change?">${esc(d.note)}</textarea><div class="help" id="save-status">Saved automatically as you type</div></div></div>${r.note?`<details><summary>Previous direction</summary><p class="meta">${esc(r.note)}</p></details>`:''}</section><details class="help"><summary>About this review</summary><p>${esc(r.status)}. Images are framed independently, not to a shared scale. Review choices do not automatically publish model or gameplay changes.</p><p>Source ID: ${esc(r.plant_id)}</p>${!sol?'<a href="round-01-review.html">Archived round-01 review</a>':''}</details>`;let versions=[{label:r.approved?'Approved baseline':'Current design',...r.revision||r}];if(r.previous&&r.revision?.pair!==r.previous.pair)versions.push({label:'Round-01',...r.previous});if(r.revision)versions.push({label:'Original',...r});version=Math.min(version,versions.length-1);$('#version').innerHTML=versions.map((v,i)=>`<option value="${i}">${v.label}</option>`).join('');$('#version').value=version;$('#angle').value=angle;function picture(){let v=versions[version];$('#picture').src=angle==='pair'?v.pair:v.views[+angle]}picture();$('#version').onchange=e=>{version=+e.target.value;picture()};$('#angle').onchange=e=>{angle=e.target.value;picture()};$('#picture').onclick=()=>{$('#zoom img').src=$('#picture').src;$('#zoom').showModal()};$('#decision').value=d.decision;$('#decision').onchange=e=>{saved[r.code]={...decision(r),decision:e.target.value};persist();render();toast(r.code+' decision saved')};$('#notes').oninput=e=>{saved[r.code]={...decision(r),note:e.target.value};persist();$('#save-status').textContent='Notes saved in this browser'};function move(n){current=visible[i+n].code;version=0;render();$('#main').scrollTop=0}$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1)}
$('#list').onclick=e=>{let b=e.target.closest('[data-item]');if(b){current=b.dataset.item;version=0;render();$('#main').scrollTop=0}};$('#query').oninput=filter;$('#scope').onchange=filter;$('#category').onchange=filter;$('#preferences-button').onclick=()=>$('#preferences-dialog').showModal();$('#preferences').oninput=e=>{preferences=e.target.value;try{localStorage.setItem(prefix+'preferences',preferences)}catch(e){toast('Copy your review to preserve preferences')}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
function exported(){return {revision:data.revision,preferences,decisions:rows.filter(r=>decision(r).decision!=='pending'||decision(r).note).map(r=>({code:r.code,plant_id:r.plant_id,name:r.name,...decision(r)}))}}$('#copy').onclick=async()=>{let d=exported(),t=d.revision+'\nPreferences:\n'+preferences+'\n\n'+(sol?'Sol':'Plant')+' decisions:\n'+d.decisions.map(r=>r.code+' / '+r.name+' / '+r.decision+(r.note?' / '+r.note:'')).join('\n');$('#export-text').textContent=t;try{await navigator.clipboard.writeText(t);$('#copy-status').textContent='Copied. Paste this review into the chat.'}catch(e){$('#copy-status').textContent='Select and copy the review text below.'}$('#export-dialog').showModal()};$('#download').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(exported(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=domain+'-review-'+data.revision+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Review file prepared')};filter();
</script></body></html>
